  function build() {

      mods.className = "modules";

        const el = document.createElement("div");

        <div class="module-header" onclick="toggle('${id}','${phase.color}','${phase.bg}','${phase.border}',this)">
          <span class="mod-num" style="background:${phase.bg};color:${phase.color}">${mod.num}</span>

          <span class="mod-time">${mod.time}</span>

    });

  function toggle(id, color, bg, border, header) {
    const body = document.getElementById(id);
    const chev = document.getElementById("chev" + id);
    const isOpen = body.classList.contains("open");
    if (openMod && openMod !== id) {
      document.getElementById(openMod).classList.remove("open");
      document.getElementById("chev" + openMod).classList.remove("open");
    }
    if (isOpen) {
      body.classList.remove("open");
      chev.classList.remove("open");
      openMod = null;
    } else {
      body.classList.add("open");
      chev.classList.add("open");
      openMod = id;
    }
